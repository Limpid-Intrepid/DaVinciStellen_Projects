<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaVINCI Field Manual — Cosplay Build Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F4F1E8;
    --ink-dim: #ABA79C;
    --panel: #232220;
    --panel-2: #2C2A27;
    --bg: #171614;
    --line: #3A3833;
    --orange: #E8630D;
    --orange-dim: #7A3A15;
    --ok: #6FA96A;
    --warn: #D64545;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.01em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header.top {
    padding: 22px 18px 16px;
    border-bottom: 3px solid var(--orange);
    background:
      repeating-linear-gradient(135deg, rgba(232,99,13,0.06) 0 8px, transparent 8px 16px),
      var(--panel);
  }
  header.top h1 {
    margin: 0;
    font-size: 28px;
    text-transform: uppercase;
    line-height: 0.95;
  }
  header.top h1 span { color: var(--orange); }
  header.top p {
    margin: 6px 0 0;
    color: var(--ink-dim);
    font-size: 14px;
    max-width: 46ch;
  }

  nav.chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  nav.chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip[data-active="true"] {
    border-color: var(--orange);
    color: var(--ink);
    background: var(--orange-dim);
  }
  .chip .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 7px;
    background: var(--ink-dim);
  }
  .chip[data-done="true"] .dot { background: var(--ok); }

  main {
    padding: 20px 16px 60px;
    max-width: 640px;
    margin: 0 auto;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    color: var(--orange);
    border: 1px solid var(--orange-dim);
    padding: 2px 8px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace;
  }

  h2.title {
    font-size: 34px;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .tagline { color: var(--ink-dim); margin: 0 0 20px; font-size: 15px; }

  section.block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  section.block h3 {
    margin: 0 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section.block.safety { border-left: 3px solid var(--warn); }
  section.block.safety h3 { color: var(--warn); }
  section.block ul { margin: 0; padding-left: 18px; }
  section.block li { margin-bottom: 7px; font-size: 14.5px; }
  section.block li:last-child { margin-bottom: 0; }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .setting {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  .setting .k { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; }
  .setting .v { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--orange); }
  .settings-note { font-size: 12.5px; color: var(--ink-dim); margin-top: 10px; font-style: italic; }

  .project {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .project-head {
    padding: 12px 14px;
    background: var(--panel-2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .project-head h4 {
    margin: 0;
    font-size: 17px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
  }
  .project-body { padding: 14px; }
  .materials {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--line);
  }
  .materials b { color: var(--ink); font-weight: 500; }

  .step {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    align-items: flex-start;
  }
  .step:last-child { margin-bottom: 0; }
  .step input[type="checkbox"] {
    margin-top: 3px;
    width: 17px; height: 17px;
    accent-color: var(--orange);
    flex-shrink: 0;
  }
  .step-num {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--orange);
    font-size: 12px;
    flex-shrink: 0;
    width: 18px;
    padding-top: 2px;
  }
  .step-text { flex: 1; }
  .step-text .st-title { font-weight: 600; font-size: 14.5px; }
  .step-text .st-detail { font-size: 14px; color: var(--ink-dim); margin-top: 2px; }
  .step.checked .st-title, .step.checked .st-detail { text-decoration: line-through; opacity: 0.55; }

  .tip {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(232,99,13,0.08);
    border-left: 3px solid var(--orange);
    font-size: 13.5px;
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .tip b { color: var(--orange); }

  .placeholder {
    padding: 30px 16px;
    text-align: center;
    color: var(--ink-dim);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    font-size: 14px;
  }
  .placeholder b { color: var(--ink); display: block; margin-bottom: 4px; }

  textarea.notes {
    width: 100%;
    min-height: 70px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 13.5px;
    padding: 10px;
    resize: vertical;
  }
  .save-state {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 6px;
    height: 14px;
  }

  .progress-bar {
    height: 5px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--orange);
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--ink-dim);
    margin: -12px 0 18px;
  }
</style>
</head>

let state = {
  active: "safety",
  progress: {},
  notes: {}
};

async function loadProgress() {
  try {
    const res = await window.storage.get('progress', false);
    if (res && res.value) state.progress = JSON.parse(res.value);
  } catch (e) { /* no saved progress yet */ }
  try {
    const res = await window.storage.get('notes', false);
    if (res && res.value) state.notes = JSON.parse(res.value);
  } catch (e) { /* no saved notes yet */ }
}

async function saveProgress() {
  try { await window.storage.set('progress', JSON.stringify(state.progress), false); }
  catch (e) { console.error('progress save failed', e); }
}

async function saveNotes(moduleId, text) {
  state.notes[moduleId] = text;
  try { await window.storage.set('notes', JSON.stringify(state.notes), false); }
  catch (e) { console.error('notes save failed', e); }
}

function stepId(moduleId, projIdx, stepIdx) {
  return moduleId + ':' + projIdx + ':' + stepIdx;
}

function moduleProgress(mod) {
  let total = 0, done = 0;
  mod.projects.forEach((p, pi) => {
    p.steps.forEach((s, si) => {
      total++;
      if (state.progress[stepId(mod.id, pi, si)]) done++;
    });
  });
  return { total, done };
}

function renderNav() {
  const nav = document.getElementById('chipNav');
  nav.innerHTML = '';
  DATA.modules.forEach(mod => {
    const { total, done } = moduleProgress(mod);
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.active = (mod.id === state.active);
    chip.dataset.done = (total > 0 && done === total);
    chip.innerHTML = '<span class="dot"></span>' + mod.name;
    chip.onclick = () => { state.active = mod.id; render(); };
    nav.appendChild(chip);
  });
}

function renderModule(mod) {
  const main = document.getElementById('main');
  let html = '';
  html += `<span class="tag">${mod.category}</span>`;
  html += `<h2 class="title display">${mod.name}</h2>`;
  html += `<p class="tagline">${mod.tagline}</p>`;

  if (mod.projects.length) {
    const { total, done } = moduleProgress(mod);
    const pct = total ? Math.round((done/total)*100) : 0;
    html += `<div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
    html += `<div class="progress-label">${done} / ${total} steps checked off</div>`;
  }

  if (mod.safety && mod.safety.length) {
    html += `<section class="block safety"><h3>⚠ Safety Notes</h3><ul>`;
    mod.safety.forEach(s => html += `<li>${s}</li>`);
    html += `</ul></section>`;
  }

  if (mod.settings && mod.settings.length) {
    html += `<section class="block"><h3>Settings — Starting Points</h3><div class="settings-grid">`;
    mod.settings.forEach(s => {
      html += `<div class="setting"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`;
    });
    html += `</div>`;
    if (mod.settingsNote) html += `<div class="settings-note">${mod.settingsNote}</div>`;
    html += `</section>`;
  }

  if (mod.projects.length) {
    mod.projects.forEach((proj, pi) => {
      html += `<div class="project"><div class="project-head"><h4>${proj.title}</h4></div><div class="project-body">`;
      html += `<div class="materials"><b>Materials:</b> ${proj.materials}</div>`;
      proj.steps.forEach((s, si) => {
        const id = stepId(mod.id, pi, si);
        const checked = !!state.progress[id];
        html += `<div class="step ${checked ? 'checked':''}">`;
        html += `<input type="checkbox" data-stepid="${id}" ${checked ? 'checked':''}>`;
        html += `<div class="step-num">${String(si+1).padStart(2,'0')}</div>`;
        html += `<div class="step-text"><div class="st-title">${s.t}</div><div class="st-detail">${s.d}</div></div>`;
        html += `</div>`;
      });
      html += `<div class="tip"><b>Tip:</b> ${proj.tip}</div>`;
      html += `</div></div>`;
    });
  } else if (mod.id !== 'safety') {
    html += `<div class="placeholder"><b>No project logged yet</b>Tell Claude what you tried on this module and it'll get added here next time.</div>`;
  }

  if (mod.note === 'materialGuide') {
    html += `<section class="block"><h3>Quick Material Notes</h3><ul>
      <li><b>EVA foam</b> — gums up blades/bits at high speed; go slower than you think.</li>
      <li><b>Acrylic</b> — cracks under rushed cuts; let the tool cut, don't force feed.</li>
      <li><b>Worbla / thermoplastics</b> — heat-formed by hand, not cut by these tools; save the powered modules for rigid backers.</li>
    </ul></section>`;
  }

  html += `<section class="block"><h3>Build Notes</h3>
    <textarea class="notes" id="notesBox" placeholder="Jot anything worth remembering for next time — a setting that worked, a mistake to avoid...">${state.notes[mod.id] || ''}</textarea>
    <div class="save-state" id="saveState"></div>
  </section>`;

  main.innerHTML = html;

  main.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      state.progress[e.target.dataset.stepid] = e.target.checked;
      await saveProgress();
      render();
    });
  });

  const notesBox = document.getElementById('notesBox');
  let saveTimer;
  notesBox.addEventListener('input', (e) => {
    clearTimeout(saveTimer);
    document.getElementById('saveState').textContent = 'Saving…';
    saveTimer = setTimeout(async () => {
      await saveNotes(mod.id, e.target.value);
      document.getElementById('saveState').textContent = 'Saved';
      setTimeout(() => { const el = document.getElementById('saveState'); if (el) el.textContent=''; }, 1500);
    }, 600);
  });
}

function render() {
  renderNav();
  const mod = DATA.modules.find(m => m.id === state.active);
  renderModule(mod);
}

(async () => {
  await loadProgress();
  render();
})();
</script>
</body>
</html>
